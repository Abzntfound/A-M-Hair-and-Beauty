[functions]
  directory = "netlify/functions"

# Google Privacy & Messaging needs the page referrer to be available on
# cross-origin requests. This policy is also the modern browser default,
# but setting it explicitly prevents a stricter hosting header from blocking
# the AdSense European regulations message.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"

# Avoid serving a stale cached homepage while Google Privacy & Messaging
# configuration/tag changes are being rolled out.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

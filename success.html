<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — A&M Hair & Beauty</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18369486768"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','AW-18369486768');</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff9fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}.card{background:#fff;border-radius:20px;padding:3rem 2rem;text-align:center;max-width:520px;width:100%;box-shadow:0 8px 40px rgba(217,70,166,.1)}.icon{font-size:4rem;margin-bottom:1rem}h1{color:#1a1a2e;font-size:1.8rem;margin-bottom:.75rem}p{color:#666;line-height:1.6;margin-bottom:1.5rem}.details{background:#fff7fc;border:1px solid #f3d3e8;border-radius:16px;padding:1rem 1.2rem;margin:1.2rem 0 1.5rem;text-align:left}.row{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid #f4e8f0}.row:last-child{border-bottom:0}.label{color:#777}.value{font-weight:700;color:#222;word-break:break-word;text-align:right}.tracking{color:#b4237d}.loading{font-size:.9rem;color:#888}.btn{display:inline-block;background:linear-gradient(135deg,#d946a6,#9333ea);color:#fff;padding:.85rem 2rem;border-radius:50px;text-decoration:none;font-weight:600;margin:.4rem}.btn-outline{background:transparent;border:2px solid #d946a6;color:#d946a6}.error{color:#a33;font-size:.9rem}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Order Confirmed!</h1>
    <p>Thank you for your purchase. Keep your A&M tracking code safe — you'll use it with your checkout email to track the order.</p>
    <div id="order-details" class="details"><div class="loading">Creating your order details…</div></div>
    <div><a href="/" class="btn">Continue Shopping</a><a href="/#track-order" class="btn btn-outline">Track Order</a></div>
  </div>
<script>
(async()=>{
 const params=new URLSearchParams(location.search),sessionId=params.get('session_id');
 if(params.get('success')!=='true'||!sessionId){location.replace('/');return;}
 const box=document.getElementById('order-details');
 async function load(){
   try{
     const r=await fetch('/.netlify/functions/order-confirmation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId})});
     const d=await r.json().catch(()=>({}));
     if(r.status===202||d.pending){box.innerHTML='<div class="loading">Finalising your order…</div>';return false;}
     if(!r.ok)throw new Error(d.error||'Could not load order details');
     box.innerHTML=`<div class="row"><span class="label">Order number</span><span class="value">${escapeHtml(d.orderNumber||'—')}</span></div><div class="row"><span class="label">A&M tracking code</span><span class="value tracking">${escapeHtml(d.trackingCode||'—')}</span></div><div class="row"><span class="label">Status</span><span class="value">${escapeHtml(String(d.status||'processing').replaceAll('_',' '))}</span></div>`;
     return true;
   }catch(e){box.innerHTML='<div class="error">Your payment is confirmed, but we could not display the order details yet. Please use your confirmation email or try the tracking page shortly.</div>';return true;}
 }
 function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
 for(let i=0;i<5;i++){if(await load())break;await new Promise(r=>setTimeout(r,1200));}
 try{Object.keys(localStorage).filter(k=>k==='amCart'||k.startsWith('amCart_')).forEach(k=>localStorage.removeItem(k));}catch{}
})();
</script>
</body>
</html>
